<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>NKV Boutique — Catálogo Digital</title>
  <meta name="description" content="Explora los catálogos digitales exclusivos de Calzado y Bolsos de NKV Boutique.">
  
  <!-- FAVICON ESTÁNDAR & TOUCH ICONS -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #b77a64;
      --primary-hover: #9f6551;
      --primary-light: #f6eee9;
      --bg-color: #f5efe9;
      --card-bg: #ffffff;
      --text-dark: #333333;
      --text-muted: #7a7a7a;
      --border-color: #e8dcd2;
      --whatsapp-color: #25d366;
      --shadow-subtle: 0 2px 8px rgba(183, 122, 100, 0.06);
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      width: 100%;
      max-width: 1100px;
      padding: 14px 16px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .brand-logo-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
    }

    .brand-logo {
      width: 100%;
      max-width: 300px;
      max-height: 95px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(183, 122, 100, 0.08));
      transition: all 0.3s ease;
    }

    .brand-text-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    /* FOOTER LOGO */
    .footer-logo-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 100%;
      margin: 14px auto 0;
      padding: 14px 16px 0;
    }

    .footer-logo {
      width: 100%;
      max-width: 420px;
      max-height: 140px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(183, 122, 100, 0.1));
      transition: all 0.3s ease;
    }

    /* FOOTER LOGO */
    .footer-logo-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 100%;
      margin: 14px auto 0;
      padding: 14px 16px 0;
    }

    .footer-logo {
      width: 100%;
      max-width: 520px;
      max-height: 170px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(183, 122, 100, 0.1));
      transition: all 0.3s ease;
    }

    .brand-nkv {
      font-family: 'Cinzel', serif;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--primary-color);
      line-height: 1.1;
    }

    .brand-boutique {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 6px;
      color: #555555;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 1px;
    }

    /* MAIN CONTAINER */
    main {
      width: 100%;
      max-width: 1100px;
      padding: 0 14px 85px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* TAB SELECTOR */
    .catalog-selector {
      display: flex;
      background: #ffffff;
      padding: 4px;
      border-radius: 50px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-subtle);
      gap: 4px;
      width: 100%;
      max-width: 400px;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border: none;
      background: transparent;
      border-radius: 40px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(183, 122, 100, 0.25);
    }

    .tab-btn.active svg {
      transform: scale(1.08);
    }

    /* VIEWER WRAPPER */
    .viewer-wrapper {
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-subtle);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border-color);
      background: #faf8f6;
    }

    .viewer-title {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--primary-color);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 18px;
      box-shadow: 0 2px 6px rgba(183, 122, 100, 0.2);
      transition: transform 0.2s;
    }

    .action-link-btn:active {
      transform: scale(0.96);
    }

    /* IFRAME CONTAINER */
    .iframe-container {
      position: relative;
      width: 100%;
      height: 68vh;
      min-height: 450px;
      max-height: 800px;
      background: #fdfbf9;
      -webkit-overflow-scrolling: touch;
      overflow: hidden;
    }

    .fp-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* QUICK CONTACT BANNER (DESKTOP) */
    .cta-banner {
      width: 100%;
      background: #ffffff;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-subtle);
    }

    .cta-text h3 {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 2px;
    }

    .cta-text p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .cta-buttons-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-whatsapp-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--whatsapp-color);
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 28px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(37, 211, 102, 0.2);
    }

    .btn-instagram-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-color);
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 28px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(183, 122, 100, 0.2);
    }

    /* FLOATING BOTTOM BAR (MÓVIL) */
    .floating-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color);
      padding: 8px 12px;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.05);
    }

    .floating-btn {
      flex: 1;
      max-width: 180px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 9px 12px;
      border-radius: 28px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      color: #ffffff;
    }

    .floating-btn.wa { background: var(--whatsapp-color); }
    .floating-btn.ig { background: var(--primary-color); }

    /* PROMOTIONAL BANNER */
    .promotional-banner {
      width: 100%;
      max-width: 100%;
      margin: 12px 0 14px 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-subtle);
      display: block;
    }

    .promotional-banner img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 600px) {
      header {
        padding: 14px 16px 6px;
      }
      .brand-logo-container {
        max-width: 260px;
      }
      .brand-logo {
        max-width: 230px;
        max-height: 75px;
      }
      .brand-nkv {
        font-size: 2rem;
      }
      .brand-subtitle {
        font-size: 0.72rem;
      }
      .iframe-container {
        height: 64vh;
        min-height: 430px;
      }
      .cta-banner {
        display: none;
      }
      main {
        padding-bottom: 68px;
      }
    }

    @media (min-width: 601px) {
      .floating-bar {
        display: none;
      }
    }
  </style>
</head>

  <script>
    const CONFIG = {
      catalogs: {
        calzado: {
          title: "Catálogo Calzado NKV",
          icon: "👠",
          url: "https://heyzine.com/flip-book/74216951e6.html",
          waMessage: "Hola NKV Boutique, estoy viendo el catálogo digital de Calzado y me gustaría consultar disponibilidad y precios de una referencia."
        },
        bolsos: {
          title: "Catálogo Bolsos NKV",
          icon: "👜",
          url: "https://heyzine.com/flip-book/4b5d8dc45b.html",
          waMessage: "Hola NKV Boutique, estoy viendo el catálogo digital de Bolsos y me gustaría consultar disponibilidad y precios de una referencia."
        }
      },
      whatsappNumber: "573183931763",
      instagramUrl: "https://www.instagram.com/nkv_boutique/"
    };

    let activeCatalog = "calzado";

    function handleLogoFallback(imgEl) {
      if (imgEl.src.includes('logo.png')) {
        imgEl.src = 'Logo_NKV_B.png';
      } else {
        imgEl.style.display = 'none';
        const logoFallback = document.getElementById('brand-text-fallback');
        if (logoFallback) logoFallback.style.display = 'flex';
      }
    }

    function updateWhatsAppLinks() {
      const current = CONFIG.catalogs[activeCatalog];
      const encodedMsg = encodeURIComponent(current.waMessage);
      const waUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodedMsg}`;
      
      const btnMain = document.getElementById('btn-whatsapp-main');
      const btnFloat = document.getElementById('btn-whatsapp-floating');
      if (btnMain) btnMain.href = waUrl;
      if (btnFloat) btnFloat.href = waUrl;
    }

    function switchCatalog(type) {
      if (!CONFIG.catalogs[type]) return;
      activeCatalog = type;
      const target = CONFIG.catalogs[type];

      // Actualizar pestañas
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.setAttribute('aria-selected', 'false');
      });
      const currentTab = document.getElementById(`tab-${type}`);
      if (currentTab) {
        currentTab.classList.add('active');
        currentTab.setAttribute('aria-selected', 'true');
      }

      // Actualizar encabezado del visor
      const titleEl = document.getElementById('current-title');
      if (titleEl) {
        titleEl.innerHTML = `<span>${target.icon}</span> ${target.title}`;
      }

      // Actualizar enlace de pantalla completa
      const fsBtn = document.getElementById('btn-fullscreen');
      if (fsBtn) fsBtn.href = target.url;

      // Actualizar Iframe
      const iframe = document.getElementById('flipbook-frame');
      if (iframe && iframe.src !== target.url) {
        iframe.src = target.url;
      }

      // Actualizar enlaces de WhatsApp con mensaje contextual
      updateWhatsAppLinks();
    }

    document.addEventListener('DOMContentLoaded', () => {
      switchCatalog('calzado');
    });
  </script>
