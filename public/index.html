<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NKV Boutique — Catálogo Digital</title>
  <meta name="description" content="Explora los catálogos digitales exclusivos de Bolsos y Calzado de NKV Boutique.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #b77a64;
      --primary-hover: #9f6551;
      --primary-light: #f6eee9;
      --primary-gradient: linear-gradient(135deg, #c58a74 0%, #a86b56 100%);
      --bg-gradient: linear-gradient(180deg, #fdfbf9 0%, #f5efe9 100%);
      --card-bg: #ffffff;
      --text-dark: #222222;
      --text-muted: #6b6b6b;
      --border-color: #ebdcd4;
      --whatsapp-color: #25d366;
      --whatsapp-hover: #20ba5a;
      --instagram-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --shadow-soft: 0 4px 20px rgba(183, 122, 100, 0.08);
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      width: 100%;
      max-width: 1100px;
      padding: 18px 16px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .brand-logo-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      max-width: 240px;
      min-height: 70px;
    }

    .brand-logo {
      max-width: 220px;
      max-height: 85px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 10px rgba(183, 122, 100, 0.1));
    }

    .brand-text-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .brand-nkv {
      font-family: 'Cinzel', serif;
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 4px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .brand-boutique {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 6px;
      color: #555555;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: var(--primary-color);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* MAIN CONTAINER */
    main {
      width: 100%;
      max-width: 1100px;
      padding: 0 16px 85px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* TAB SELECTOR */
    .catalog-selector {
      display: flex;
      background: #ffffff;
      padding: 6px;
      border-radius: 50px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-soft);
      gap: 8px;
      width: 100%;
      max-width: 440px;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border: none;
      background: transparent;
      border-radius: 40px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s;
    }

    .tab-btn.active {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(183, 122, 100, 0.35);
    }

    .tab-btn.active svg {
      transform: scale(1.1);
    }

    /* VIEWER WRAPPER */
    .viewer-wrapper {
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-color);
      background: #faf7f5;
    }

    .viewer-title {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewer-actions {
      display: flex;
      gap: 8px;
    }

    .action-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary-color);
      text-decoration: none;
      background: #ffffff;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      transition: all 0.2s;
      cursor: pointer;
    }

    .action-link-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary-color);
    }

    .iframe-container {
      position: relative;
      width: 100%;
      height: 72vh;
      min-height: 480px;
      max-height: 820px;
      background: #fdfbf9;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--primary-color);
      font-size: 0.9rem;
      font-weight: 500;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid var(--border-color);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* QUICK CONTACT BANNER (DESKTOP) */
    .cta-banner {
      width: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #faf6f3 100%);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow-soft);
    }

    .cta-text {
      flex: 1;
      min-width: 240px;
    }

    .cta-text h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 3px;
    }

    .cta-text p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .cta-buttons-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-whatsapp-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--whatsapp-color);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
      transition: all 0.2s;
    }

    .btn-whatsapp-cta:hover {
      background: var(--whatsapp-hover);
      transform: translateY(-1px);
    }

    .btn-instagram-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--instagram-gradient);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(220, 39, 67, 0.25);
      transition: all 0.2s;
    }

    .btn-instagram-cta:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    /* FLOATING BOTTOM BAR (MOBILE ONLY) */
    .floating-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
    }

    .floating-btn {
      flex: 1;
      max-width: 220px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.2s;
    }

    .floating-btn.wa {
      background: var(--whatsapp-color);
    }

    .floating-btn.ig {
      background: var(--instagram-gradient);
    }

    .floating-btn:active {
      transform: scale(0.97);
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .iframe-container {
        height: 68vh;
        min-height: 420px;
      }
      .cta-banner {
        display: none;
      }
      main {
        padding-bottom: 75px;
      }
    }

    @media (min-width: 601px) {
      .floating-bar {
        display: none;
      }
    }
  </style>
</head>

          url: "https://heyzine.com/flip-book/9ec6be30a1.html",
          waMessage: "Hola NKV Boutique, estoy viendo el catálogo digital de Calzado y me gustaría consultar disponibilidad y precios de una referencia."
        }
      },
      whatsappNumber: "573183931763",
      instagramUrl: "https://www.instagram.com/nkv_boutique/"
    };

    let activeCatalog = "bolsos";

    function handleLogoFallback(imgEl) {
      if (imgEl.src.includes('logo.png')) {
        imgEl.src = 'Logo_NKV_B.png';
      } else {
        imgEl.style.display = 'none';
        const logoFallback = document.getElementById('brand-text-fallback');
        if (logoFallback) logoFallback.style.display = 'flex';
      }
    }

    function hideSpinner() {
      const spinner = document.getElementById('loading-spinner');
      if (spinner) spinner.style.opacity = '0';
    }

    function showSpinner() {
      const spinner = document.getElementById('loading-spinner');
      if (spinner) spinner.style.opacity = '1';
    }

    function updateWhatsAppLinks() {
      const current = CONFIG.catalogs[activeCatalog];
      const encodedMsg = encodeURIComponent(current.waMessage);
      const waUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodedMsg}`;
      
      const btnMain = document.getElementById('btn-whatsapp-main');
      const btnFloat = document.getElementById('btn-whatsapp-floating');
      if (btnMain) btnMain.href = waUrl;
      if (btnFloat) btnFloat.href = waUrl;
    }

    function switchCatalog(type) {
      if (!CONFIG.catalogs[type]) return;
      activeCatalog = type;
      const target = CONFIG.catalogs[type];

      // Actualizar pestañas
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.setAttribute('aria-selected', 'false');
      });
      const currentTab = document.getElementById(`tab-${type}`);
      if (currentTab) {
        currentTab.classList.add('active');
        currentTab.setAttribute('aria-selected', 'true');
      }

      // Actualizar encabezado del visor
      const titleEl = document.getElementById('current-title');
      if (titleEl) {
        titleEl.innerHTML = `<span>${target.icon}</span> ${target.title}`;
      }

      // Actualizar botón de pantalla completa
      const fsBtn = document.getElementById('btn-fullscreen');
      if (fsBtn) {
        fsBtn.href = target.url;
      }

      // Actualizar Iframe
      const iframe = document.getElementById('flipbook-frame');
      if (iframe && iframe.src !== target.url) {
        showSpinner();
        iframe.src = target.url;
      }

      // Actualizar enlaces de WhatsApp con mensaje contextual
      updateWhatsAppLinks();
    }

    // Inicialización al cargar
    document.addEventListener('DOMContentLoaded', () => {
      switchCatalog('bolsos');
    });
  </script>
</body>
</html>
